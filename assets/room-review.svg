<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- outer wall -->
  <rect x="8" y="8" width="784" height="484" rx="18" fill="#2A3548"/>
  <!-- inner floor -->
  <rect x="28" y="28" width="744" height="444" rx="10" fill="#1A2332"/>
  <!-- subtle floor grain -->
  <g opacity="0.15" stroke="#243044" stroke-width="1.5" fill="none">
    <path d="M60 80 H740 M60 160 H740 M60 240 H740 M60 320 H740 M60 400 H740"/>
  </g>
  <!-- mint accent rug under table -->
  <ellipse cx="400" cy="310" rx="230" ry="120" fill="#064E3B" opacity="0.55"/>
  <ellipse cx="400" cy="310" rx="210" ry="105" fill="none" stroke="#34D399" stroke-width="2.5" opacity="0.45"/>

  <!-- large wall board / review screen (north wall) -->
  <rect x="200" y="40" width="400" height="130" rx="8" fill="#0B1220" stroke="#34D399" stroke-width="4"/>
  <rect x="214" y="54" width="372" height="102" rx="4" fill="#243044"/>
  <!-- fake UI blocks on screen -->
  <rect x="230" y="70" width="140" height="70" rx="4" fill="#1A2332"/>
  <rect x="386" y="70" width="180" height="20" rx="3" fill="#34D399" opacity="0.55"/>
  <rect x="386" y="100" width="160" height="12" rx="2" fill="#64748B" opacity="0.7"/>
  <rect x="386" y="120" width="120" height="12" rx="2" fill="#64748B" opacity="0.5"/>
  <!-- mint status pip on screen -->
  <circle cx="560" cy="140" r="10" fill="#34D399"/>
  <circle cx="560" cy="140" r="4" fill="#0B1220" opacity="0.4"/>

  <!-- review table (long conference) -->
  <rect x="220" y="230" width="360" height="130" rx="12" fill="#2A3548" stroke="#34D399" stroke-width="3"/>
  <rect x="236" y="246" width="328" height="98" rx="8" fill="#243044"/>
  <!-- papers on table -->
  <rect x="280" y="270" width="70" height="50" rx="3" fill="#F1F5F9" opacity="0.9"/>
  <rect x="290" y="262" width="70" height="50" rx="3" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
  <path d="M302 278 H348 M302 290 H340 M302 302 H332" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>

  <!-- three chairs around table -->
  <!-- left -->
  <rect x="140" y="260" width="56" height="70" rx="10" fill="#34D399" opacity="0.75"/>
  <ellipse cx="168" cy="350" rx="26" ry="12" fill="#34D399" opacity="0.35"/>
  <!-- right -->
  <rect x="604" y="260" width="56" height="70" rx="10" fill="#34D399" opacity="0.75"/>
  <ellipse cx="632" cy="350" rx="26" ry="12" fill="#34D399" opacity="0.35"/>
  <!-- bottom (reviewer) -->
  <rect x="360" y="390" width="80" height="50" rx="10" fill="#34D399" opacity="0.85"/>
  <rect x="372" y="378" width="56" height="18" rx="5" fill="#34D399"/>
  <ellipse cx="400" cy="448" rx="32" ry="10" fill="#34D399" opacity="0.35"/>

  <!-- ready-for-review inbox tray (side console) -->
  <rect x="640" y="80" width="110" height="100" rx="8" fill="#2A3548" stroke="#34D399" stroke-width="2.5"/>
  <rect x="652" y="92" width="86" height="16" rx="3" fill="#34D399" opacity="0.35"/>
  <!-- stacked docs in tray -->
  <rect x="658" y="118" width="74" height="12" rx="2" fill="#F1F5F9" opacity="0.95"/>
  <rect x="658" y="134" width="74" height="12" rx="2" fill="#F1F5F9" opacity="0.8"/>
  <rect x="658" y="150" width="74" height="12" rx="2" fill="#F1F5F9" opacity="0.65"/>
  <!-- mint check badge on tray -->
  <circle cx="730" cy="160" r="14" fill="#34D399"/>
  <path d="M723 160 L728 165 L738 152" fill="none" stroke="#0B1220" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- small plant corner -->
  <circle cx="100" cy="400" r="26" fill="#166534"/>
  <circle cx="88" cy="388" r="12" fill="#22C55E"/>
  <circle cx="112" cy="390" r="11" fill="#4ADE80"/>
  <rect x="94" y="418" width="12" height="28" rx="2" fill="#78350F"/>
</svg>
