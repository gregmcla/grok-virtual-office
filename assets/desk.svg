<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100">
  <!-- desk top (large) -->
  <rect x="4" y="4" width="112" height="56" rx="7" fill="#2A3548" stroke="#F1F5F9" stroke-width="1.8"/>
  <rect x="10" y="10" width="100" height="44" rx="4" fill="#243044"/>
  <!-- monitor: thin landscape slab at far (top) edge -->
  <rect x="40" y="12" width="40" height="7" rx="2" fill="#0B1220" stroke="#2DD4BF" stroke-width="1.6"/>
  <!-- stand nub -->
  <rect x="56" y="19" width="8" height="4" rx="1" fill="#64748B"/>
  <!-- keyboard -->
  <rect x="30" y="36" width="48" height="14" rx="2" fill="#2A3548"/>
  <rect x="34" y="39" width="40" height="8" rx="1" fill="#F1F5F9" opacity="0.2"/>
  <!-- mouse -->
  <ellipse cx="92" cy="44" rx="7" ry="9" fill="#2A3548"/>
  <line x1="92" y1="38" x2="92" y2="48" stroke="#F1F5F9" stroke-width="1" opacity="0.4"/>
  <!-- chair (clearly separate, below desk) -->
  <!-- seat -->
  <ellipse cx="60" cy="78" rx="20" ry="12" fill="#2DD4BF" opacity="0.9"/>
  <!-- backrest -->
  <rect x="42" y="64" width="36" height="12" rx="4" fill="#2DD4BF"/>
  <!-- chair wheels hint -->
  <circle cx="48" cy="90" r="3" fill="#64748B"/>
  <circle cx="60" cy="92" r="3" fill="#64748B"/>
  <circle cx="72" cy="90" r="3" fill="#64748B"/>
</svg>
