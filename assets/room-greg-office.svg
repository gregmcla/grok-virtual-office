<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">

  <!-- outer wall -->
  <rect x="8" y="8" width="784" height="484" rx="18" fill="#2A3548"/>
  <!-- inner floor -->
  <rect x="28" y="28" width="744" height="444" rx="10" fill="#1A2332"/>
  <!-- subtle floor grain -->
  <g opacity="0.18" stroke="#243044" stroke-width="1.5" fill="none">
    <path d="M60 80 H740 M60 140 H740 M60 200 H740 M60 260 H740 M60 320 H740 M60 380 H740 M60 440 H740"/>
  </g>
  
  
  <!-- rug -->
  <ellipse cx="400" cy="320" rx="180" ry="100" fill="#1E3A2F"/>
  <ellipse cx="400" cy="320" rx="160" ry="85" fill="none" stroke="#2DD4BF" stroke-width="2" opacity="0.4"/>
  <!-- big desk -->
  <rect x="250" y="200" width="300" height="140" rx="10" fill="#2A3548" stroke="#FBBF24" stroke-width="3"/>
  <rect x="265" y="215" width="270" height="100" rx="6" fill="#243044"/>
  <!-- monitor -->
  <rect x="340" y="225" width="120" height="70" rx="4" fill="#0B1220" stroke="#F1F5F9" stroke-width="2"/>
  <rect x="350" y="235" width="100" height="50" rx="2" fill="#2DD4BF" opacity="0.35"/>
  <rect x="390" y="295" width="20" height="12" fill="#64748B"/>
  <!-- chair -->
  <ellipse cx="400" cy="390" rx="40" ry="22" fill="#2DD4BF" opacity="0.5"/>
  <rect x="375" y="360" width="50" height="30" rx="8" fill="#2DD4BF" opacity="0.75"/>
  <!-- window -->
  <rect x="80" y="60" width="160" height="120" rx="6" fill="#0EA5E9" opacity="0.25" stroke="#F1F5F9" stroke-width="3"/>
  <line x1="160" y1="60" x2="160" y2="180" stroke="#F1F5F9" stroke-width="2" opacity="0.5"/>
  <line x1="80" y1="120" x2="240" y2="120" stroke="#F1F5F9" stroke-width="2" opacity="0.5"/>
  <!-- plant -->
  <circle cx="680" cy="140" r="36" fill="#166534"/>
  <circle cx="665" cy="125" r="18" fill="#22C55E"/>
  <circle cx="695" cy="128" r="16" fill="#4ADE80"/>
  <rect x="672" y="165" width="16" height="40" rx="3" fill="#78350F"/>
  <!-- lamp -->
  <circle cx="280" cy="230" r="14" fill="#FBBF24" opacity="0.9"/>
  <rect x="274" y="242" width="12" height="28" fill="#64748B"/>


</svg>
